<!DOCTYPE html>
<html>

<head>

<title>Plant Disease Detection</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


<h1>🌱 Plant Disease Detection System</h1>


<p class="subtitle">

AI-based plant disease identification using Deep Learning

</p>



<form action="/predict" method="POST" enctype="multipart/form-data">


<input 
type="file"
name="file"
accept="image/*"
required>


<br><br>


<button type="submit" onclick="showLoading()">

🔍 Detect Disease

</button>


<p id="loading" style="display:none; margin-top:20px; font-size:18px; color:#2e7d32;">

🔍 Analyzing image... Please wait

</p>


</form>


</div>



<script>

function showLoading(){

    // Show loading message
    document.getElementById("loading").style.display = "block";


    // Change button text
    document.querySelector("button").innerHTML = "Processing...";

}

</script>


</body>

</html>
